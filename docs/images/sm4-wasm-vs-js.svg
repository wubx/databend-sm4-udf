<text x='590.0' y='336.0' font-size='12' text-anchor='middle' fill='#666' font-weight='normal'>50K</text>
<text x='330.0' y='366.0' font-size='12' text-anchor='middle' fill='#666' font-weight='normal'>行数（对数刻度）</text>
<text x='18' y='186.0' font-size='12' fill='#666' text-anchor='middle' transform='rotate(-90 18 186.0)'>加速倍数</text>
