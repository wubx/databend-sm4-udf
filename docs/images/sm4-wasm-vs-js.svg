<text x='62.0' y='230.0' font-size='12' text-anchor='end' fill='#666' font-weight='normal'>50</text>
<line x1='70' x2='590' y1='136.1' y2='136.1' stroke='#e5e5e5'/>
<text x='62.0' y='140.1' font-size='12' text-anchor='end' fill='#666' font-weight='normal'>100</text>
<line x1='70' x2='590' y1='314.2' y2='314.2' stroke='#c0392b' stroke-dasharray='5 4'/>
<text x='584.0' y='308.2' font-size='12' text-anchor='end' fill='#c0392b' font-weight='normal'>1× 持平线</text>
<text x='70.0' y='336.0' font-size='12' text-anchor='middle' fill='#666' font-weight='normal'>1K</text>
<text x='376.1' y='336.0' font-size='12' text-anchor='middle' fill='#666' font-weight='normal'>10K</text>
