<title id='t'>SM4：WASM 比 JS 快多少倍（JS 耗时 ÷ WASM 耗时）</title>
<desc id='d'>不同明文长度下，随行数增加 WASM 相对 JS 的加速倍数；低于 1 表示 JS 更快。</desc>
<rect width='100%' height='100%' fill='#ffffff'/>
<text x='20.0' y='30.0' font-size='17' text-anchor='start' fill='#333' font-weight='bold'>SM4：WASM 比 JS 快多少倍（JS 耗时 ÷ WASM 耗时）</text>
