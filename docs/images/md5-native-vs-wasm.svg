<title id='t'>MD5：WASM 耗时是内置函数的几倍（越接近 1 越好）</title>
<desc id='d'>1 到 100 万行时 WASM MD5 与内置 md5() 的耗时比；1–5 万行与 10–100 万行为两轮独立测量。</desc>
